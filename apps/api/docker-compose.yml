version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasksuite
      POSTGRES_PASSWORD: tasksuite
      POSTGRES_DB: tasksuite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://tasksuite:tasksuite@postgres:5432/tasksuite?schema=public
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
    command: sh -c "pnpm prisma migrate deploy && node dist/main.js"

volumes:
  postgres_data:

